name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "${GITHUB_WORKSPACE}/release.jks"
            echo "KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "Keystore bereitgestellt - Release wird signiert."
          else
            echo "::warning::Kein KEYSTORE_B64-Secret gesetzt - Release-APK bleibt unsigniert."
          fi

      - name: Build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease --no-daemon

      - name: Rename artifact
        id: artifact
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          TARGET="meshdroid-${VERSION_NAME}.apk"
          cp "$APK" "$TARGET"
          echo "path=${TARGET}" >> "$GITHUB_OUTPUT"
          sha256sum "$TARGET" | tee "${TARGET}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshdroid-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
          generate_release_notes: true
